    max_discharge_current: vb2_dcl
    heartbeat_switch: pylontech_heartbeat_enabled
    inverter_heartbeat: powmr_2_heartbeat_ms
    rs485_status: powmr_2_rs485_status
    requested_force_charge: pylontech_grid_charge_request
    total_voltage_high_alarm: jk_total_voltage_high
    total_voltage_low_alarm: jk_total_voltage_low
    cell_voltage_high_alarm: jk_cell_voltage_high
    cell_voltage_low_alarm: jk_cell_voltage_low
    cell_temp_high_alarm: jk_cell_temperature_high
    cell_temp_low_alarm: jk_cell_temperature_low
    mosfet_temp_high_alarm: jk_mosfet_temperature_high
    charge_overcurrent_alarm: jk_charge_overcurrent
    discharge_overcurrent_alarm: jk_discharge_overcurrent
    module_overvoltage_protection: jk_total_voltage_high
    module_undervoltage_protection: jk_total_voltage_low
    cell_overvoltage_protection: jk_cell_voltage_high
    cell_undervoltage_protection: jk_cell_voltage_low
    cell_overtemp_protection: jk_cell_temperature_high
    cell_undertemp_protection: jk_cell_temperature_low
    mosfet_overtemp_protection: jk_mosfet_temperature_high
    state_of_health: jk_soh
    cycle_count: jk_cycle_count
    max_cell_voltage: jk_max_cell_voltage
    min_cell_voltage: jk_min_cell_voltage
