esphome:
  name: jkbms-s3-dual-proxy

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source: github://syssi/esphome-jk-bms@main
  # Multi-instance capable: one responder is created for each inverter UART.
  # v1.3.1 only accepts one instance.  main adds list/multi-instance support.
  - source: github://fahmula/esphome-pylontech-rs485@main

wifi:
  ssid: omg
  password: "97477181"

api:
  encryption:
    key: !secret jkbms_s3_dual_proxy__encryption_key

ota:
  - platform: esphome

logger:
  level: DEBUG

substitutions:
  device_addr: "1"    # NOTE: On change also update the first byte in `switch` custom_command and write_lambda
  modbus_controller_update_interval: "15s"
  bms_control_params_skip_updates: "20"   # 20 - update every 20th update cycle
  # Conservative per-inverter allocation.  Keep the sum at or below 1.0;
  # 0.90 leaves a 10% margin for polling and inverter response timing.
  vb1_current_share: "0.45"
  vb2_current_share: "0.45"
  # Set these for the battery chemistry and inverter commissioning limits.
  vb1_charge_voltage: "56.8"
  vb1_discharge_voltage: "48.0"
  vb2_charge_voltage: "56.8"
  vb2_discharge_voltage: "48.0"
  
uart:
  - id: uart_jkbms
    rx_pin: GPIO40
    tx_pin: GPIO39
    baud_rate: 115200
    rx_buffer_size: 512
    debug:
      direction: BOTH

  # Each PowMR must have its own isolated RS485 transceiver and its own UART.
  # Change the four pins to match the ESP32-S3 wiring.  These baud rates match
  # the Pylontech RS485 profile; use auto-direction RS485 transceivers.
  - id: uart_powmr_1
    tx_pin: GPIO17
    rx_pin: GPIO18
    baud_rate: 9600
    rx_buffer_size: 256
  - id: uart_powmr_2
    tx_pin: GPIO15
    rx_pin: GPIO16
    baud_rate: 9600
    rx_buffer_size: 256

modbus:
  - id: modbus_jkbms
    uart_id: uart_jkbms
  

modbus_controller:
  - id: bms0
    address: 0x01             # Must match the JK-BMS configured/DIP address
    modbus_id: modbus_jkbms
    setup_priority: -10
    update_interval: 15s
    command_throttle: 50ms

# A proxy must fail silent if JK polling stops.  The virtual sensors below
# become NAN after this interval, which makes the Pylontech responder stop.
globals:
  - id: jk_last_seen_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# This activates the ESPHome switch domain required by the upstream Pylontech
# component and enables its optional inverter-heartbeat reporting.
switch:
  - platform: template
    id: pylontech_heartbeat_enabled
    name: "Pylontech inverter heartbeat monitoring"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# charging, discharging, and balancing binary_sensors made as the template sensors
# to optimize number of modbus requests
binary_sensor:
  - platform: template
    id: charging
    name: "charging"
    lambda: |-
      return id(charging_raw).state == 1;

  - platform: template
    id: discharging
    name: "discharging"
    lambda: |-
      return id(discharging_raw).state == 1;

  - platform: template
    id: balancing
    name: "balancing"
    lambda: |-
      return id(balancing_raw).state == 1;

  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charging float mode"
    address: 0x1114
    register_type: holding
    bitmask: 0x0200

  # JK alarm-bit mapping for the Pylontech status/protection frames.
  - platform: template
    id: jk_charge_protection
    name: "JK charge protection"
    lambda: |-
      const uint32_t a = (uint32_t) id(alarms_bitmask).state;
      return !id(charging).state || (a & ((1UL << 4) | (1UL << 5) | (1UL << 6) |
                                         (1UL << 7) | (1UL << 8) | (1UL << 9)));
  - platform: template
    id: jk_discharge_protection
    name: "JK discharge protection"
    lambda: |-
      const uint32_t a = (uint32_t) id(alarms_bitmask).state;
      return !id(discharging).state || (a & ((1UL << 4) | (1UL << 11) | (1UL << 12) |
                                             (1UL << 13) | (1UL << 14) | (1UL << 15)));
  - platform: template
    id: jk_system_fault
    name: "JK system fault"
    lambda: |-
      const uint32_t a = (uint32_t) id(alarms_bitmask).state;
      return a & ((1UL << 2) | (1UL << 3) | (1UL << 10) | (1UL << 16) |
                  (1UL << 17) | (1UL << 20) | (1UL << 21));

  # Individual JK alarm bits, mapped into the Pylontech command-62 status
  # frame. These are telemetry/protection indications; JK itself remains the
  # final hardware protection authority.
  - platform: template
    id: jk_cell_voltage_high
    name: "JK cell overvoltage"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & (1UL << 4);'
  - platform: template
    id: jk_total_voltage_high
    name: "JK battery overvoltage"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & (1UL << 5);'
  - platform: template
    id: jk_cell_voltage_low
    name: "JK cell undervoltage"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & (1UL << 11);'
  - platform: template
    id: jk_total_voltage_low
    name: "JK battery undervoltage"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & (1UL << 12);'
  - platform: template
    id: jk_cell_temperature_high
    name: "JK battery overtemperature"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & ((1UL << 8) | (1UL << 15));'
  - platform: template
    id: jk_cell_temperature_low
    name: "JK battery undertemperature"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & (1UL << 9);'
  - platform: template
    id: jk_mosfet_temperature_high
    name: "JK MOSFET overtemperature"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & (1UL << 1);'
  - platform: template
    id: jk_charge_overcurrent
    name: "JK charge overcurrent"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & ((1UL << 6) | (1UL << 7));'
  - platform: template
    id: jk_discharge_overcurrent
    name: "JK discharge overcurrent"
    lambda: 'return ((uint32_t) id(alarms_bitmask).state) & ((1UL << 13) | (1UL << 14));'
  # Never request Pylontech "charge immediately" / grid force-charge.
  - platform: template
    id: pylontech_grid_charge_request
    name: "Pylontech grid charge request"
    lambda: 'return false;'
  - platform: template
    id: powmr_1_rs485_status
    name: "PowMR 1 Pylontech RS485 connected"
    update_interval: never
  - platform: template
    id: powmr_2_rs485_status
    name: "PowMR 2 Pylontech RS485 connected"
    update_interval: never

