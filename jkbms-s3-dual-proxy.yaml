    value_type: U_WORD
    register_count: 2
    response_size: 2
    disabled_by_default: true
    bitmask: 0x01

  # 0x12A8   168    INT32    2    R    SOCCapRemain    mAH
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "capacity remaining"
    address: 0x12A8
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    device_class: energy_storage
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12AC   172   UINT32    4    R    SOCFullChargeCap    mAH
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "full charge capacity"
    address: 0x12AC
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    device_class: energy_storage
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B0   176   UINT32    4    R    SOCCycleCount   次
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: jk_cycle_count
    name: "charging cycles"
    address: 0x12B0
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    accuracy_decimals: 0

  # 0x12B4   180   UINT32    4    R    SOCCycleCap     mAH
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "total charging cycle capacity"
    address: 0x12B4
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    state_class: measurement
    unit_of_measurement: "Ah"
    accuracy_decimals: 0
    filters:
      - multiply: 0.001

  # 0x12B8   184 UINT8+UINT8 2    R    StateOfHealth % / Precharge stats (1:打开 ; 0:关闭)
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: jk_soh
    name: "state of health"
    address: 0x12B8
    register_type: holding
    value_type: U_WORD
    register_count: 4
    response_size: 4
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      return data[item->offset];

  # 0x12BA   186   UINT16    2    R    UserAlarm

  # 0x12BC   188   UINT32    4    R    RunTime         S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "total runtime in seconds"
    address: 0x12BC
    register_type: holding
    value_type: U_DWORD
    register_count: 4
    response_size: 4
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    id: total_runtime

  # 0x12C0   192 UINT8+UINT8 Charge (1:打开 ; 0:关闭) / Discharge (1:打开 ; 0:关闭)
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: charging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    disabled_by_default: true
    bitmask: 0xFF00

  - platform: modbus_controller
    modbus_controller_id: bms0
    id: discharging_raw
    address: 0x12C0
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    disabled_by_default: true
    bitmask: 0x00FF

  # 0x12C2   194   UINT16    2    R    UserAlarm2
  # - platform: modbus_controller
  #   modbus_controller_id: bms0
  #   name: "UserAlarm2 Status"
  #   address: 0x12C2
  #   register_type: holding
  #   value_type: U_WORD
  #   register_count: 2
  #   response_size: 2
  #   state_class: measurement
  #   accuracy_decimals: 0

  # 0x12C4   196   UINT16    2    R    TimeDcOCPR      S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "disacharge OCPR left"
    address: 0x12C4
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12C6   198   UINT16    2    R    TimeDcSCPR      S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "disacharge SCPR left"
    address: 0x12C6
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    state_class: measurement
    accuracy_decimals: 0

  # 0x12C8   200   UINT16    2    R    TimeCOCPR       S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charge OCPR left"
    address: 0x12C8
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CA   202   UINT16    2    R    TimeCSCPR       S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "charge SCPR left"
    address: 0x12CA
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CC   204   UINT16    2    R    TimeUVPR        S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "uVPR left"
    address: 0x12CC
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12CE   206   UINT16    2    R    TimeOVPR        S
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "oVPR left"
    address: 0x12CE
    register_type: holding
    value_type: U_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "S"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0

  # 0x12D0   208 UINT8+UINT8 2    R    AbsentBitmask (Bit0: MOS TempSensorAbsent, Bit1: BATTempSensor1Absent, Bit2: BATTempSensor2Absent, Bit4: BATTempSensor4Absent, Bit5: BATTempSensor5Absent) / Heating
  # 0x12D2   210   UINT16    2    R    Reserved
  # 0x12D4   212   UINT16    2    R    TimeEmergency   S
  # 0x12D6   214   UINT16    2    R    BatCurCorrect
  # 0x12D8   216   UINT16    2    R    VolChargCur     mV
  # 0x12DA   218   UINT16    2    R    VolDischargCur  mV
  # 0x12DC   214   FLOAT     4    R    BatVolCorrect
  # 0x12E4   228   UINT16    2    R    BatVol          0.01V
  # 0x12E6   230   INT16     2    R    HeatCurrent     mA
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "heating current"
    address: 0x12E6
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 3
    filters:
      - multiply: 0.001

  # 0x12F0   240   UINT32    4    R    SysRunTicks     0.1S

  # 0x12F8   248   INT16     2    R    TempBat 3       0.1℃
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "temperature sensor 3"
    address: 0x12F8
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x12FA   248   INT16     2    R    TempBat 4       0.1℃
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "temperature sensor 4"
    address: 0x12FA
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x12FC   248   INT16     2    R    TempBat 5       0.1℃
  - platform: modbus_controller
    modbus_controller_id: bms0
    id: jkbms_bat_temp4
    name: "temperature sensor 5"
    address: 0x12FC
    register_type: holding
    value_type: S_WORD
    register_count: 2
    response_size: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

# ----

  # 0x1504   260 UINT8+UINT8 2    RW    RCV Time / RFV Time 0.1 H
  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "rCV Time"
    address: 0x1504
    register_type: holding
    value_type: U_WORD
    register_count: 1
    response_size: 1
    skip_updates: ${bms_control_params_skip_updates}
    unit_of_measurement: "H"
    device_class: duration
    state_class: measurement
    bitmask: 0xFF
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: bms0
    name: "rFV Time"
    address: 0x1504
    register_type: holding
    value_type: U_WORD
    register_count: 1
    response_size: 1
    skip_updates: ${bms_control_params_skip_updates}
    unit_of_measurement: "H"
    device_class: duration
    state_class: measurement
    bitmask: 0xFF00
    filters:
      - multiply: 0.1

  # Pylontech core data, duplicated deliberately for the two virtual packs.
  # If no successful JK core reading is received for 45 seconds, NAN makes the
  # upstream responder halt rather than serve stale battery information.
  - platform: template
    id: vb1_soc
    name: "Virtual battery 1 state of charge"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(jk_soc).state : NAN;
  - platform: template
    id: powmr_1_heartbeat_ms
    name: "PowMR 1 Pylontech poll interval"
    unit_of_measurement: "ms"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: vb1_voltage
    name: "Virtual battery 1 voltage"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(total_voltage).state : NAN;
  - platform: template
    id: vb1_current
    name: "Virtual battery 1 current"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(current).state : NAN;
  - platform: template
    id: vb1_temperature
    name: "Virtual battery 1 temperature"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(jk_battery_temperature).state : NAN;
  - platform: template
    id: vb1_max_voltage
    name: "Virtual battery 1 maximum charge voltage"
    update_interval: 1s
    lambda: 'return ${vb1_charge_voltage};'
  - platform: template
    id: vb1_min_voltage
    name: "Virtual battery 1 minimum discharge voltage"
    update_interval: 1s
    lambda: 'return ${vb1_discharge_voltage};'
  - platform: template
    id: vb1_ccl
    name: "Virtual battery 1 charge current limit"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      if (!id(jk_last_seen_ms) || millis() - id(jk_last_seen_ms) > 45000 || id(jk_charge_protection).state || id(jk_system_fault).state) return 0.0f;
      return id(jk_bms_ccl).state * ${vb1_current_share};
  - platform: template
    id: vb1_dcl
    name: "Virtual battery 1 discharge current limit"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 1s
    lambda: |-
      if (!id(jk_last_seen_ms) || millis() - id(jk_last_seen_ms) > 45000 || id(jk_discharge_protection).state || id(jk_system_fault).state) return 0.0f;
      return id(jk_bms_dcl).state * ${vb1_current_share};

  - platform: template
    id: vb2_soc
    name: "Virtual battery 2 state of charge"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(jk_soc).state : NAN;
  - platform: template
    id: powmr_2_heartbeat_ms
    name: "PowMR 2 Pylontech poll interval"
    unit_of_measurement: "ms"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: vb2_voltage
    name: "Virtual battery 2 voltage"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(total_voltage).state : NAN;
  - platform: template
    id: vb2_current
    name: "Virtual battery 2 current"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(current).state : NAN;
  - platform: template
    id: vb2_temperature
    name: "Virtual battery 2 temperature"
    update_interval: 1s
    lambda: |-
      return (id(jk_last_seen_ms) && millis() - id(jk_last_seen_ms) <= 45000) ? id(jk_battery_temperature).state : NAN;
  - platform: template
    id: vb2_max_voltage
    name: "Virtual battery 2 maximum charge voltage"
