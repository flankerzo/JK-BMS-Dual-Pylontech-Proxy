    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.001
      - lambda: |-
          if (x < 0.0f && !isnan(id(total_voltage).state)) {
            return abs(x) * id(total_voltage).state;
          }
          return 0.0f;

